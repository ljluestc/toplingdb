[package]
name = "toplingdb"
version = "9.1.0"
edition = "2021"
rust-version = "1.80"
description = "A high-performance embeddable persistent key-value store in Rust"
license = "GPL-2.0 OR Apache-2.0"
repository = "https://github.com/topling/toplingdb"
homepage = "https://rocksdb.org/"
keywords = ["database", "key-value", "embedded", "storage", "lsm"]
categories = ["database-implementations", "embedded"]
authors = ["ToplingDB Contributors"]

[lib]
name = "toplingdb"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "toplingdb-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "db_bench"
path = "src/bin/db_bench.rs"

[[bin]]
name = "ldb"
path = "src/bin/ldb.rs"

[[bin]]
name = "sst_dump"
path = "src/bin/sst_dump.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Compression
lz4 = { version = "1.25", optional = true }
zstd = { version = "0.13", optional = true }
snap = { version = "1.1", optional = true }  # Snappy compression
bzip2 = { version = "0.4", optional = true }

# Memory management
tikv-jemalloc-ctl = { version = "0.6", optional = true }

# Concurrency & threading
crossbeam = "0.8"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6.1"
arc-swap = "1.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
metrics = "0.23"

# I/O operations
mmap = "0.1"
memmap2 = "0.9"
libc = "0.2"

# Hashing & cryptography
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
farmhash = "1.1"
blake3 = "1.5"

# Utilities
bytes = "1.7"
uuid = { version = "1.10", features = ["v4", "serde"] }
once_cell = "1.19"
lazy_static = "1.5"
num_cpus = "1.16"

# CLI & configuration
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"

# Benchmarking
criterion = { version = "0.5", optional = true }

# FFI bindings
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
jni = { version = "0.21", optional = true }

# Benchmarking dependencies
fastrand = "2.1"

[dev-dependencies]
tempfile = "3.12"
quickcheck = "1.0"
proptest = "1.5"
rstest = "0.21"
criterion = { version = "0.5", features = ["html_reports"] }
pretty_assertions = "1.4"
env_logger = "0.11"

[features]
default = ["compression", "jemalloc"]
compression = ["lz4", "zstd", "snap", "bzip2"]
jemalloc = ["tikv-jemalloc-ctl"]
python-bindings = ["pyo3"]
java-bindings = ["jni"]
benchmarks = ["criterion"]
full = ["compression", "jemalloc", "python-bindings", "java-bindings"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# [workspace]
# members = [
#     "toplingdb-core",
#     "toplingdb-ffi",
#     "toplingdb-bench",
#     "toplingdb-bindings-python",
#     "toplingdb-bindings-java",
#     "toplingdb-tools"
# ]

[[bench]]
name = "db_bench"
harness = false
path = "benches/db_bench.rs"

[[bench]]
name = "memtable_bench"
harness = false
path = "benches/memtable_bench.rs"

[[bench]]
name = "cache_bench"
harness = false
path = "benches/cache_bench.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]